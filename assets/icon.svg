<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#f5f0e8"/>
  
  <!-- Meditation bell (dorje) - a dharma symbol -->
  <!-- Bell body -->
  <path d="M 400 300 Q 380 320 380 380 L 380 600 Q 380 640 420 660 L 604 660 Q 644 640 644 600 L 644 380 Q 644 320 624 300 Z" fill="#8b5e3c"/>
  
  <!-- Bell highlight/shine -->
  <path d="M 420 320 Q 410 330 410 380 L 410 550 Q 410 580 440 595 L 560 595 Q 590 580 590 550 L 590 380 Q 590 330 580 320 Z" fill="#a67c52" opacity="0.6"/>
  
  <!-- Bell top (handle/knob) -->
  <ellipse cx="512" cy="300" rx="60" ry="40" fill="#8b5e3c"/>
  <ellipse cx="512" cy="300" rx="45" ry="30" fill="#a67c52" opacity="0.6"/>
  
  <!-- Bell clapper (tongue) -->
  <rect x="495" y="600" width="34" height="80" rx="17" fill="#8b5e3c"/>
  <rect x="505" y="610" width="14" height="70" fill="#a67c52" opacity="0.7"/>
  
  <!-- Decorative rings on bell -->
  <circle cx="512" cy="400" r="95" fill="none" stroke="#d4c4b0" stroke-width="8"/>
  <circle cx="512" cy="470" r="95" fill="none" stroke="#d4c4b0" stroke-width="8"/>
  <circle cx="512" cy="540" r="95" fill="none" stroke="#d4c4b0" stroke-width="12"/>
  
  <!-- Small decorative dots representing enlightenment -->
  <circle cx="300" cy="200" r="12" fill="#8b5e3c" opacity="0.5"/>
  <circle cx="724" cy="200" r="12" fill="#8b5e3c" opacity="0.5"/>
  <circle cx="200" cy="512" r="12" fill="#8b5e3c" opacity="0.5"/>
  <circle cx="824" cy="512" r="12" fill="#8b5e3c" opacity="0.5"/>
  
  <!-- Bottom decorative elements (lotus-inspired) -->
  <path d="M 420 750 Q 380 770 380 820 Q 380 860 420 880 L 604 880 Q 644 860 644 820 Q 644 770 604 750 Z" fill="#d4c4b0" opacity="0.4"/>
  <path d="M 440 760 Q 430 775 430 800 Q 430 830 460 850 L 564 850 Q 594 830 594 800 Q 594 775 584 760 Z" fill="#8b5e3c" opacity="0.3"/>
</svg>
